name: Research and reading checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm research:validate
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: git diff --exit-code -- public/data/institutional-map
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Retain browser acceptance recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
